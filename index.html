<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Link previews (WhatsApp etc.) do not run JavaScript, so the title/description
    tags below are rewritten with the latest readings by .github/workflows/update.yml.
    Visitors get live numbers from the script at the bottom.
  -->
  <title>SG PM2.5</title>
  <meta name="description" content="Latest Singapore PM2.5 readings by region.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SG Haze">
  <meta property="og:title" content="SG PM2.5">
  <meta property="og:description" content="Latest Singapore PM2.5 readings by region.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SG PM2.5">
  <meta name="twitter:description" content="Latest Singapore PM2.5 readings by region.">
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #e5e5e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #333; } }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
    th { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Singapore PM2.5</h1>
    <p id="status">Loading…</p>
    <table hidden>
      <thead>
        <tr><th>Region</th><th class="num" id="pm25-label">PM2.5</th><th></th><th class="num">PSI 24-hr</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    const API_URL = "https://api-open.data.gov.sg/v2/real-time/api/psi";
    const REGIONS = ["north", "south", "east", "west", "central"];

    // NEA 24-hr PM2.5 bands (µg/m³). Keep in sync with update.yml.
    function pm25Band(v) {
      if (v == null) return "n/a";
      if (v <= 55) return "Normal";
      if (v <= 150) return "Elevated";
      if (v <= 250) return "High";
      return "Very high";
    }

    function psiBand(v) {
      if (v == null) return "n/a";
      if (v <= 50) return "Good";
      if (v <= 100) return "Moderate";
      if (v <= 200) return "Unhealthy";
      if (v <= 300) return "Very unhealthy";
      return "Hazardous";
    }

    function cell(text, className) {
      const td = document.createElement("td");
      td.textContent = text ?? "–";
      if (className) td.className = className;
      return td;
    }

    async function load() {
      const status = document.getElementById("status");
      try {
        const response = await fetch(API_URL);
        const body = await response.json();
        if (body.code !== 0) throw new Error(body.errorMsg || `HTTP ${response.status}`);

        const item = body.data.items[0];
        const readings = item.readings;
        // pm25_one_hourly is not always published; fall back to the 24-hr average.
        const pm25 = readings.pm25_one_hourly || readings.pm25_twenty_four_hourly;
        const psi = readings.psi_twenty_four_hourly || {};

        document.getElementById("pm25-label").textContent =
          `PM2.5 ${readings.pm25_one_hourly ? "1-hr" : "24-hr"}`;
        document.getElementById("rows").replaceChildren(...REGIONS.map((name) => {
          const tr = document.createElement("tr");
          tr.append(
            cell(name.charAt(0).toUpperCase() + name.slice(1)),
            cell(pm25[name], "num"), cell(pm25Band(pm25[name])),
            cell(psi[name], "num"), cell(psiBand(psi[name])),
          );
          return tr;
        }));
        document.querySelector("table").hidden = false;

        const time = new Date(item.updatedTimestamp).toLocaleString("en-SG", {
          timeZone: "Asia/Singapore", day: "numeric", month: "short", hour: "numeric", minute: "2-digit",
        });
        status.textContent = `Updated ${time} · source: data.gov.sg (NEA)`;
      } catch (error) {
        status.textContent = `Could not load PSI data: ${error.message}`;
      }
    }

    load();
    setInterval(load, 5 * 60 * 1000);
  </script>
</body>
</html>
