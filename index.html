<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Link previews (WhatsApp etc.) do not run JavaScript, so the title/description
    tags below are rewritten with the latest readings by .github/workflows/update.yml.
    Visitors get live numbers from the script at the bottom.
  -->
  <title>SG PM2.5</title>
  <meta name="description" content="Latest Singapore PM2.5 readings by region.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SG Haze">
  <meta property="og:title" content="SG PM2.5">
  <meta property="og:description" content="Latest Singapore PM2.5 readings by region.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SG PM2.5">
  <meta name="twitter:description" content="Latest Singapore PM2.5 readings by region.">
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #e5e5e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #333; } }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
    th { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Singapore PM2.5</h1>
    <p id="status">Loading…</p>
    <table hidden>
      <thead>
        <tr><th>Region</th><th class="num">PM2.5 1-hr (µg/m³)</th><th>Band</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    // The trailing path segment is only a cache-buster; any value returns the latest data.
    const API_URL = "https://www.haze.gov.sg/api/airquality/jsondata/";
    const REGIONS = ["North", "South", "East", "West", "Central"];

    // NEA 1-hr PM2.5 bands (µg/m³). 🔴 marks 56 and above; keep in sync with update.yml.
    function pm25Band(v) {
      if (v == null) return "n/a";
      if (v <= 55) return "I (Normal)";
      if (v <= 150) return "II (Elevated)";
      if (v <= 250) return "III (High)";
      return "IV (Very high)";
    }

    function cell(text, className) {
      const td = document.createElement("td");
      td.textContent = text ?? "–";
      if (className) td.className = className;
      return td;
    }

    async function load() {
      const status = document.getElementById("status");
      try {
        const response = await fetch(API_URL + Math.floor(Date.now() / 1000));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const body = await response.json();

        document.getElementById("rows").replaceChildren(...REGIONS.map((name) => {
          const raw = body.Chart1HRPM25?.[name]?.Data?.at(-1)?.value;
          const value = raw == null ? null : Math.round(raw);
          const tr = document.createElement("tr");
          tr.append(
            cell(name),
            cell(value >= 56 ? `🔴 ${value}` : value, "num"),
            cell(pm25Band(value)),
          );
          return tr;
        }));
        document.querySelector("table").hidden = false;

        status.textContent = `As of ${body.ChartAsOfDate} · source: https://www.haze.gov.sg/`;
      } catch (error) {
        status.textContent = `Could not load PM2.5 data: ${error.message}`;
      }
    }

    load();
    setInterval(load, 5 * 60 * 1000);
  </script>
</body>
</html>
