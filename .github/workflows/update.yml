name: Update preview

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Bake latest readings into OpenGraph tags
        run: |
          curl -sf https://api-open.data.gov.sg/v2/real-time/api/psi -o psi.json

          # e.g. "PM2.5 n54 s62🔴 e62🔴 w93🔴 c92🔴 ug/m3"; some previewers (Teams) show only the title.
          # 🔴 marks 56 and above (NEA "Elevated" band or worse). Keep in sync with index.html.
          summary=$(jq -r '
            .data.items[0].readings as $r
            | ($r.pm25_one_hourly // $r.pm25_twenty_four_hourly) as $pm
            | "PM2.5 \(["north", "south", "east", "west", "central"]
                | map("\(.[:1])\($pm[.])\(if ($pm[.] // 0) >= 56 then "🔴" else "" end)") | join(" ")) ug/m3"
          ' psi.json)
          echo "TITLE=$summary" >> "$GITHUB_ENV"
          echo "DESCRIPTION=$summary" >> "$GITHUB_ENV"

      - name: Write tags
        run: |
          mkdir -p _site
          perl -pe '
            s/(<title>)[^<]*/$1$ENV{TITLE}/;
            s/(<meta (?:property|name)="(?:og:|twitter:)title" content=")[^"]*/$1$ENV{TITLE}/;
            s/(<meta (?:property|name)="(?:og:|twitter:)?description" content=")[^"]*/$1$ENV{DESCRIPTION}/;
          ' index.html > _site/index.html
          grep -E '<title>|og:(title|description)' _site/index.html

      - uses: actions/upload-pages-artifact@v5

      - id: deployment
        uses: actions/deploy-pages@v5
