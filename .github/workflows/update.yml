name: Update preview

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Bake latest readings into OpenGraph tags
        run: |
          # The trailing path segment is only a cache-buster; any value returns the latest data.
          curl -sf "https://www.haze.gov.sg/api/airquality/jsondata/$(date +%s)" -o haze.json

          # Latest 1-hr PM2.5 (µg/m³) per region, e.g. "PM2.5 n80🔴 s130🔴 e119🔴 w158🔴 c139🔴 µg/m³".
          # Some previewers (Teams) show only the title.
          # 🔴 marks 56 and above (NEA band II or worse). Keep in sync with index.html.
          summary=$(jq -r '
            .Chart1HRPM25 as $pm
            | "PM2.5 \(["North", "South", "East", "West", "Central"]
                | map(($pm[.].Data[-1].value // null | if . then round else . end) as $v
                      | "\(.[:1] | ascii_downcase)\($v // "?")\(if ($v // 0) >= 56 then "🔴" else "" end)")
                | join(" ")) µg/m³"
          ' haze.json)
          echo "TITLE=$summary" >> "$GITHUB_ENV"
          # e.g. "As of 10pm on 8 Oct 2026". The value lands in HTML and $GITHUB_ENV unescaped,
          # so allow only plain characters; anything else fails the job and skips the deploy.
          asof=$(jq -r '.ChartAsOfDate
            | if type == "string" and test("\\A[0-9A-Za-z :,]{1,40}\\z") then . else error("unexpected ChartAsOfDate") end' haze.json)
          echo "DESCRIPTION=As of $asof" >> "$GITHUB_ENV"

      - name: Write tags
        run: |
          mkdir -p _site
          perl -pe '
            s/(<title>)[^<]*/$1$ENV{TITLE}/;
            s/(<meta (?:property|name)="(?:og:|twitter:)title" content=")[^"]*/$1$ENV{TITLE}/;
            s/(<meta (?:property|name)="(?:og:|twitter:)?description" content=")[^"]*/$1$ENV{DESCRIPTION}/;
          ' index.html > _site/index.html
          grep -E '<title>|og:title|description' _site/index.html

      - uses: actions/upload-pages-artifact@v5

      - id: deployment
        uses: actions/deploy-pages@v5
